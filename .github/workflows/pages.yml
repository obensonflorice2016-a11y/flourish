name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the site
        run: |
          mkdir -p _site
          cp app.js views.js data.js cloud.js help.js qrcode.js styles.css \
            index.html sw.js manifest.json favicon.svg \
            apple-touch-icon.png icon-180.png icon-192.png icon-512.png \
            README.md .nojekyll _site/
          test -s _site/app.js
          test -s _site/views.js
          test -s _site/data.js
          test -s _site/cloud.js
          test -s _site/help.js
          test -s _site/qrcode.js
          test -s _site/styles.css
          test -s _site/index.html
          test -s _site/icon-192.png
          test -s _site/icon-512.png
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
