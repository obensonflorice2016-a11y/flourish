name: pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the site
        run: |
          mkdir -p _site
          copy_or_decode() {
            local name="$1"
            if [ -f "$name" ] && [ "$(wc -c < "$name")" -gt 1000 ]; then
              cp "$name" "_site/$name"
            else
              cat parts/"${name}".*.b64 | tr -d '\n' | base64 -d | gzip -d > "_site/$name"
            fi
          }
          copy_or_decode app.js
          copy_or_decode views.js
          copy_or_decode cloud.js
          copy_or_decode help.js
          copy_or_decode data.js
          copy_or_decode qrcode.js
          cp index.html styles.css sw.js manifest.json favicon.svg README.md .nojekyll _site/
          base64 -d apple-touch-icon.png.b64 > _site/apple-touch-icon.png
          base64 -d icon-180.png.b64 > _site/icon-180.png
          base64 -d icon-192.png.b64 > _site/icon-192.png
          base64 -d icon-512.png.b64 > _site/icon-512.png
          test -s _site/app.js
          test -s _site/views.js
          test -s _site/cloud.js
          test -s _site/help.js
          test -s _site/qrcode.js
          test -s _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
