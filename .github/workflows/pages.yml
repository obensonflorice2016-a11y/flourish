name: pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js data.js qrcode.js sw.js manifest.json favicon.svg README.md .nojekyll _site/
          base64 -d apple-touch-icon.png.b64 > _site/apple-touch-icon.png
          base64 -d icon-180.png.b64 > _site/icon-180.png
          base64 -d icon-192.png.b64 > _site/icon-192.png
          base64 -d icon-512.png.b64 > _site/icon-512.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
