<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5B2A72" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Flourish" />
    <meta name="description" content="Flourish keeps Florice's week on her phone. No account. No server." />
    <title>Flourish</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="shell">
      <aside id="aside">
        <div>
          <p class="kicker">For Florice</p>
          <h1>Less time. More life.</h1>
          <p class="motto" id="motto">Health is a daily choice</p>
        </div>
        <p class="soft">One place for today, the week, the goals, and the deadlines. Thoughts land in the inbox. Sunday and Monday stay free unless you say otherwise.</p>
      </aside>
      <div id="phone">
        <main id="screen"></main>
        <button id="theme" type="button">Dark</button>
        <button id="dump" type="button">Brain dump</button>
        <nav id="nav">
          <button type="button" data-tab="today" class="active">Today</button>
          <button type="button" data-tab="plan">Plan</button>
          <button type="button" data-tab="goals">Goals</button>
          <button type="button" data-tab="track">Trackers</button>
          <button type="button" data-tab="help">Help</button>
        </nav>
      </div>
    </div>
    <div id="overlay"></div>
    <input id="import-file" type="file" accept="application/json,.json" hidden />
    <canvas id="confetti" aria-hidden="true"></canvas>
    <script src="./qrcode.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
